# Render Blueprint for Automated Cloud Deployment
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: library-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DB_HOST
        fromDatabase:
          name: library-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: library-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: library-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: library-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: library-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
    healthCheckPath: /actuator/health

databases:
  - name: library-postgres
    databaseName: library
    user: library_user
    plan: free
    region: oregon
