spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library}
    username: ${DB_USER:library_user}
    password: ${DB_PASSWORD:changeme}

  jpa:
    show-sql: true

logging:
  level:
    com.library: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
