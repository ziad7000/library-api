server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: library-api

  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:library}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:library_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:changeme}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Security & JWT Properties
security:
  jwt:
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# Business Rules Parameters
library:
  max-active-loans: 5
  loan-period-days: 14
  max-renewals: 2
  daily-fine-rate: 2.00
  hold-duration-days: 3

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
